# Runs on every pull request against main: calls the shared ci.yml quality
# gate, then -- only for PRs from this repository (never forks) and only if
# CI passed -- assumes the read-only plan role via OIDC and runs
# `terraform plan` against iac/environments/prod, posting/updating a single
# sticky PR comment with the result (SPEC.md section 2.1). iac/bootstrap is
# never planned here: it is admin-applied only (design.md's Migration /
# Rollout), CI must never touch it beyond ci.yml's fmt/validate/tflint.
#
# `concurrency` below shares its group name with cd.yml's apply job, on
# purpose: both workflows take S3 native locks (`use_lockfile`) on the SAME
# state object (iac/environments/prod), and a plan racing an apply for the
# same lock fails loudly ("Error acquiring the state lock") rather than
# queueing. A shared group serializes every plan/apply repo-wide.
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: '1.11.4'

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  plan:
    name: plan
    needs: ci
    # Fork PRs cannot be trusted with credentials to this AWS account: OIDC
    # role assumption is skipped outright rather than relying only on
    # `pull_request` (vs. `pull_request_target`) semantics -- the plan role's
    # own trust policy is also pinned StringEquals to this exact repo/org, so
    # this `if:` is defense in depth, not the only guard.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: iac-terraform-state
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Reuses iac/scripts/tf-init.sh so the local, PR-plan, and CD-apply
      # init commands can never drift apart (design.md Decision 7).
      - name: terraform init (environments/prod)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./iac/scripts/tf-init.sh

      # Plan output is written straight to a file, never interpolated into a
      # shell string -- Terraform resource attributes are attacker-
      # influenceable via the PR diff itself (threat matrix: "PR commands" /
      # shell injection), so it must never pass through `${{ }}` into a
      # `run:` block.
      #
      # `admin_password` has no default (environments/prod/variables.tf) --
      # a literal placeholder is safe here because `terraform plan` never
      # applies, so this value is never written to the real SSM parameter.
      - name: terraform plan (environments/prod)
        id: plan_prod
        working-directory: iac/environments/prod
        env:
          TF_VAR_admin_password: placeholder-plan-only-never-applied
        run: |
          set +e
          terraform plan -no-color -input=false >"${GITHUB_WORKSPACE}/plan-prod.txt" 2>&1
          echo "exitcode=$?" >>"$GITHUB_OUTPUT"
          set -e
          cat "${GITHUB_WORKSPACE}/plan-prod.txt"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-environments-prod
          path: plan-prod.txt
          retention-days: 30

      # Reads the plan file from disk (fs.readFileSync) and passes it to the
      # GitHub API as a plain JS string via scripts/render-plan-comment.mjs
      # -- never re-entered into a shell, so backticks/`$(...)` in the plan
      # output render literally in the comment instead of executing.
      - name: Post sticky plan comment
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_EXIT_CODE: ${{ steps.plan_prod.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const { renderPlanComment, findStickyComment, STICKY_COMMENT_MARKER } = await import(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'render-plan-comment.mjs')
            );

            let planText;
            try {
              planText = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'plan-prod.txt'), 'utf8');
            } catch (err) {
              planText = `(failed to read plan-prod.txt: ${err.message})`;
            }

            const body = renderPlanComment({ planText, exitCode: process.env.PLAN_EXIT_CODE });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = findStickyComment(comments, STICKY_COMMENT_MARKER);

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan errored
        if: steps.plan_prod.outputs.exitcode != '0'
        run: exit 1
